<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EE">
<title>Финансы</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Те же цвета, что и в приложении на компьютере: тёплая песочная база,
     единственный акцент — жжёная охра. Шапка не заливка, а тот же фон с линией. */
  :root {
    --primary: #9C5B2E; --primary-dark: #7F4822; --primary-light: #C07B47;
    --header-from: #F6F3EE; --header-to: #F6F3EE; --header-muted: #6B6154;
    --bg: #F6F3EE; --card: #FFFDFA; --border: #E7E0D5;
    --text: #211D18; --text2: #6B6154; --muted: #9C9283;
    --expense: #CC5A4A; --income: #62905A; --accent: #D9A441;
    --track: #EBE4D9; --selected: #F4E7D6; --shadow: rgba(60,45,25,.06);
    --notice-bg: #FAF0DD; --notice-border: #EBDCBC; --notice-text: #6A5423;
    --bad-bg: #FBEAE6; --bad-border: #F0CCC4; --bad-text: #8C3A2C;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --primary: #D4884A; --primary-dark: #B16F3A; --primary-light: #E4A06A;
    --header-from: #191614; --header-to: #191614; --header-muted: #B3A899;
    --bg: #191614; --card: #211D19; --border: #322C26;
    --text: #F0EAE1; --text2: #B3A899; --muted: #877C6E;
    --expense: #F07A68; --income: #86B06E; --accent: #E4B45C;
    --track: #2A251F; --selected: #342A1D; --shadow: rgba(0,0,0,.35);
    --notice-bg: #2A2318; --notice-border: #443A26; --notice-text: #E8D9A8;
    --bad-bg: #34211C; --bad-border: #57352C; --bad-text: #FFA69E;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  header {
    background: var(--bg); color: var(--text);
    border-bottom: 1px solid var(--border);
    padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
  }

  .brand { display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; }
  .brand button { background: transparent; border: 1.4px solid var(--border); color: var(--text2);
                  font-size: 13px; padding: 7px 12px; border-radius: 10px; margin-left: 6px; }

  .balance { margin-top: 18px; }
  .balance .caption { font-size: 10.5px; letter-spacing: .05em; font-weight: 600; color: var(--muted); }
  .balance .value { font-size: 34px; font-weight: 700; margin-top: 3px; letter-spacing: -.01em; }
  .balance .stats { font-size: 12.5px; color: var(--text2); margin-top: 8px; }

  .monthbar { display: flex; align-items: center; justify-content: space-between; gap: 10px;
              margin-top: 16px; font-size: 14px; font-weight: 600; }
  .monthbar button { background: transparent; border: 1.4px solid var(--border); color: var(--text2);
                     width: 32px; height: 32px; border-radius: 16px; font-size: 16px; line-height: 1; }
  .monthbar button[disabled] { opacity: .35; }
  .monthbar span { flex: 1; text-align: center; }

  main { padding: 14px 14px calc(94px + env(safe-area-inset-bottom)); }

  .card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px;
          box-shadow: 0 1px 10px var(--shadow); }
  .card h3 { margin: 0 0 10px; font-size: 14.5px; }

  .row { display: flex; align-items: center; gap: 11px; padding: 9px 2px; }
  .row + .row { border-top: 1px solid var(--border); }
  .row .body { flex: 1; min-width: 0; }
  .row .title { font-size: 14.5px; }
  .row .note { font-size: 12px; color: var(--muted); margin-top: 2px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .amount { font-size: 14.5px; font-weight: 600; white-space: nowrap; }
  .row .sub { font-size: 11.5px; color: var(--muted); text-align: right; margin-top: 2px; }

  .badge { width: 38px; height: 38px; border-radius: 50%; flex: 0 0 38px;
           display: flex; align-items: center; justify-content: center; }
  .badge svg { width: 21px; height: 21px; }

  .daygroup { font-size: 12.5px; font-weight: 600; color: var(--text2); margin: 14px 2px 4px;
              display: flex; justify-content: space-between; }
  .daygroup span { color: var(--muted); font-weight: 400; }

  .track { height: 6px; border-radius: 3px; background: var(--track); margin-top: 7px; overflow: hidden; }
  .track div { height: 100%; border-radius: 3px; background: var(--primary); }

  .fab { position: fixed; right: 18px; bottom: calc(78px + env(safe-area-inset-bottom));
         width: 58px; height: 58px; border-radius: 29px; border: 0; background: var(--accent);
         color: #4A3708; font-size: 30px; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.28); z-index: 5; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
        background: var(--card); border-top: 1px solid var(--border);
        display: flex; padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; background: none; border: 0; color: var(--muted);
               font-size: 11px; padding: 9px 0 8px; }
  nav button.active { color: var(--primary); font-weight: 600; }
  nav button svg { display: block; margin: 0 auto 3px; width: 21px; height: 21px; }

  .sheet { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; display: none; z-index: 20; }
  .sheet.open { display: block; }
  .sheet header { position: sticky; top: 0; z-index: 2; }
  .sheet .content { padding: 16px 14px calc(30px + env(safe-area-inset-bottom)); }

  .tabs { display: flex; gap: 6px; margin-top: 12px; }
  .tabs button { flex: 1; background: transparent; border: 1.4px solid var(--border); color: var(--text2);
                 padding: 9px 0; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .tabs button.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .chips button { background: var(--card); border: 1.4px solid var(--border); color: var(--text2);
                  padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  .chips button.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }

  label.field { display: block; font-size: 11.5px; font-weight: 600; color: var(--text2);
                margin: 14px 2px 6px; letter-spacing: .02em; }

  input, select { width: 100%; font: inherit; color: var(--text); background: var(--card);
                  border: 1.4px solid var(--border); border-radius: 12px; padding: 11px 12px; }
  input:focus, select:focus { outline: 0; border-color: var(--primary); }
  input.amount { font-size: 28px; font-weight: 700; text-align: right; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
  .tile { background: var(--card); border: 2px solid transparent; border-radius: 14px;
          padding: 10px 4px; text-align: center; font-size: 11.5px; }
  .tile.sel { border-color: var(--primary); background: var(--selected); }
  .tile .badge { margin: 0 auto 6px; }
  .tile div.name { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px;
         font-size: 15px; font-weight: 600; margin-top: 14px; }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.ghost { background: transparent; color: var(--text2); border: 1.4px solid var(--border); }
  .btn.danger { background: transparent; color: var(--expense); border: 1.4px solid var(--border); }

  .banner { background: var(--notice-bg); border: 1px solid var(--notice-border); color: var(--notice-text);
            border-radius: 12px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 12px; }
  .banner.bad { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad-text); }
  .banner.tappable { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .center { text-align: center; padding: 30px 10px; }
  .split { display: flex; gap: 10px; }
  .split > * { flex: 1; }
  .big { font-size: 22px; font-weight: 700; }
</style>
</head>
<body>

<header id="top">
  <div class="brand">
    <span id="screen-title">Финансы</span>
    <span>
      <button id="btn-refresh">Обновить</button>
      <button id="btn-settings">⚙</button>
    </span>
  </div>
  <div class="balance">
    <div class="caption" id="balance-caption">ОБЩИЙ БАЛАНС</div>
    <div class="value" id="balance">—</div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="monthbar" id="monthbar">
    <button id="month-prev">‹</button><span id="month-label"></span><button id="month-next">›</button>
  </div>
</header>

<main>
  <div id="pending-banner" class="banner" style="display:none"></div>
  <div id="view"><div class="center muted">Загружаю…</div></div>
</main>

<button class="fab" id="btn-add">+</button>

<nav id="nav"></nav>

<!-- операция -->
<section class="sheet" id="sheet-add">
  <header>
    <div class="brand"><span id="add-title">Новая операция</span><button id="add-close">Закрыть</button></div>
    <div class="tabs" id="add-tabs">
      <button data-kind="0" class="active">Расход</button>
      <button data-kind="1">Доход</button>
      <button data-kind="2">Перевод</button>
    </div>
  </header>
  <div class="content">
    <label class="field">СУММА</label>
    <input class="amount" id="add-amount" inputmode="decimal" placeholder="0">
    <div class="muted" id="add-hint" style="margin-top:6px">Можно ввести выражение: 450+120*2</div>

    <div id="add-category-block">
      <label class="field">КАТЕГОРИЯ</label>
      <div class="tiles" id="add-categories"></div>
    </div>

    <label class="field" id="add-account-label">СЧЁТ</label>
    <select id="add-account"></select>

    <div id="add-to-block" style="display:none">
      <label class="field">НА СЧЁТ</label>
      <select id="add-to-account"></select>
    </div>

    <label class="field">ДАТА</label>
    <input type="date" id="add-date">

    <label class="field">КОММЕНТАРИЙ</label>
    <input id="add-note" placeholder="необязательно">

    <button class="btn primary" id="add-save">Добавить</button>
    <button class="btn danger" id="add-delete" style="display:none">Удалить операцию</button>
    <button class="btn ghost" id="add-cancel">Отмена</button>
  </div>
</section>

<!-- прогноз -->
<section class="sheet" id="sheet-forecast">
  <header><div class="brand"><span>Прогноз накоплений</span><button id="forecast-close">Закрыть</button></div></header>
  <div class="content">
    <div class="muted" id="forecast-info"></div>

    <div id="forecast-near"></div>

    <label class="field">СРОК</label>
    <div class="chips" id="forecast-horizons"></div>

    <label class="field">ИЛИ СВОЯ ДАТА</label>
    <input type="date" id="forecast-until">

    <div class="split">
      <div>
        <label class="field">ПОПОЛНЕНИЕ В МЕСЯЦ</label>
        <input id="forecast-topup" inputmode="decimal" value="0">
      </div>
      <div style="max-width:110px">
        <label class="field">ЧИСЛО</label>
        <input id="forecast-day" inputmode="numeric" value="1">
      </div>
    </div>

    <div id="forecast-result"></div>
  </div>
</section>

<!-- настройки -->
<section class="sheet" id="sheet-settings">
  <header><div class="brand"><span>Подключение</span><button id="settings-close">Закрыть</button></div></header>
  <div class="content">
    <label class="field">ОФОРМЛЕНИЕ</label>
    <div class="chips" id="cfg-theme">
      <button data-theme="light">Светлая</button>
      <button data-theme="dark">Тёмная</button>
      <button data-theme="system">Как в системе</button>
    </div>

    <div class="muted" style="margin-top:16px">Те же данные, что в приложении на компьютере: «Ещё» → «Синхронизация с телефоном».</div>

    <label class="field">ВЛАДЕЛЕЦ (логин на GitHub)</label>
    <input id="cfg-owner" autocapitalize="none" autocorrect="off" spellcheck="false">

    <label class="field">ПРИВАТНЫЙ РЕПОЗИТОРИЙ</label>
    <input id="cfg-repo" autocapitalize="none" autocorrect="off" spellcheck="false">

    <label class="field">ТОКЕН</label>
    <input id="cfg-token" type="password" autocapitalize="none" autocorrect="off" spellcheck="false">

    <div class="muted" style="margin-top:8px">
      Токен хранится только в этом браузере и никуда больше не отправляется — кроме самого GitHub.
    </div>

    <button class="btn primary" id="cfg-save">Сохранить и проверить</button>
    <button class="btn ghost" id="cfg-forget">Забыть на этом устройстве</button>
    <div id="cfg-status" class="muted" style="margin-top:12px"></div>
  </div>
</section>

<script>
'use strict';

// ═══════════════════════ хранилище ═══════════════════════

const LS = {
  read(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } },
  write(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} },

  get cfg() { return LS.read('fw.cfg', {}); },
  set cfg(v) { LS.write('fw.cfg', v); },
  get state() { return LS.read('fw.state', null); },
  set state(v) { LS.write('fw.state', v); },
  get icons() { return LS.read('fw.icons', {}); },
  set icons(v) { LS.write('fw.icons', v); },
  get months() { return LS.read('fw.months', {}); },
  set months(v) { LS.write('fw.months', v); },
  get queue() { return LS.read('fw.queue', []); },        // ещё не отправлено
  set queue(v) { LS.write('fw.queue', v); },
  get sent() { return LS.read('fw.sent', []); },          // отправлено, но компьютер ещё не подтвердил
  set sent(v) { LS.write('fw.sent', v); },
};

// ═══════════════════════ GitHub ═══════════════════════

function api(path) {
  const c = LS.cfg;
  return 'https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' +
         encodeURIComponent(c.repo) + '/contents/' + path;
}

async function ghGet(path) {
  const c = LS.cfg;
  const ref = c.branch ? '&ref=' + encodeURIComponent(c.branch) : '';
  const r = await fetch(api(path) + '?t=' + Date.now() + ref, {
    headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' },
    cache: 'no-store',
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('GitHub ' + r.status + (r.status === 401 ? ' — токен не принят' : ''));
  const j = await r.json();
  return { text: decodeURIComponent(escape(atob((j.content || '').replace(/\n/g, '')))), sha: j.sha };
}

async function ghPut(path, text, message) {
  const c = LS.cfg;
  const body = { message, content: btoa(unescape(encodeURIComponent(text))) };
  if (c.branch) body.branch = c.branch;

  const r = await fetch(api(path), {
    method: 'PUT',
    headers: {
      Authorization: 'Bearer ' + c.token,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return r.json();
}

/** Имена файлов в папке репозитория; нет папки — пустой список. */
async function ghList(dir) {
  const c = LS.cfg;
  const ref = c.branch ? '&ref=' + encodeURIComponent(c.branch) : '';
  const r = await fetch(api(dir) + '?t=' + Date.now() + ref, {
    headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' },
    cache: 'no-store',
  });

  if (r.status === 404) return [];
  if (!r.ok) throw new Error('GitHub ' + r.status);

  const j = await r.json();
  return Array.isArray(j) ? j.map(f => f.name) : [];
}

// GitHub отвечает 404 и на «нет файла», и на «репозиторий не виден токену» —
// без отдельного запроса причину не различить.
async function ghRepo() {
  const c = LS.cfg;
  const r = await fetch('https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' +
                        encodeURIComponent(c.repo) + '?t=' + Date.now(), {
    headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' },
    cache: 'no-store',
  });

  if (r.status === 401) throw new Error('Токен не принят — проверьте, что скопирован целиком и не истёк.');
  if (r.status === 404) throw new Error(
    'Репозиторий ' + c.owner + '/' + c.repo + ' не виден этому токену. Проверьте имя репозитория ' +
    'и что в токене на вкладке Repository access выбран именно он.');
  if (!r.ok) throw new Error('GitHub ответил ' + r.status);
  return r.json();
}

// ═══════════════════════ мелочи ═══════════════════════

const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

const byId = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const round2 = v => Math.round(v * 100) / 100;

function money(value) {
  const s = LS.state || {};
  const cents = !!s.showCents;
  const text = Math.abs(value).toLocaleString('ru-RU', {
    minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
  return (value < 0 ? '−' : '') + text.replace(/ /g, ' ') + ' ' + (s.currencySymbol || '₽');
}

function percent(share) {
  const p = share * 100;
  if (p > 0 && p < 1) return '<1%';
  return Math.round(p) + '%';
}

function evalAmount(input) {
  if (!input) return NaN;
  const clean = String(input).replace(/[\s ]/g, '').replace(/,/g, '.').replace(/[х×]/gi, '*').replace(/÷/g, '/');
  if (!/^[0-9.+\-*/()]+$/.test(clean)) return NaN;
  try {
    const v = Function('"use strict";return (' + clean + ')')();
    return typeof v === 'number' && isFinite(v) ? round2(v) : NaN;
  } catch (e) { return NaN; }
}

function iso(date) {
  return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
const todayISO = () => iso(new Date());

// «14 сентября», с годом — только если он не текущий
function shortDate(date) {
  const text = date.getDate() + ' ' + MONTHS_GEN[date.getMonth()];
  return date.getFullYear() === new Date().getFullYear() ? text : text + ' ' + date.getFullYear();
}

const monthKey = s => String(s).slice(0, 7);

function monthTitle(ym) {
  const [y, m] = ym.split('-').map(Number);
  const now = new Date();
  return MONTHS_NOM[m - 1] + (y === now.getFullYear() ? '' : ' ' + y);
}

function dayTitle(isoDay) {
  const today = todayISO();
  const yesterday = iso(new Date(Date.now() - 86400000));
  const d = new Date(isoDay + 'T00:00:00');
  const text = d.getDate() + ' ' + MONTHS_GEN[d.getMonth()];
  if (isoDay === today) return 'Сегодня, ' + text;
  if (isoDay === yesterday) return 'Вчера, ' + text;
  return text;
}

/**
 * Кружок категории. Рисунки приходят с компьютера в icons.json; пока их нет —
 * например, при первом запуске или если на компьютере набор новее — в кружке
 * показываем первую букву названия. Пустым он не остаётся никогда.
 */
function icon(key, color, size, label) {
  const set = LS.icons || {};
  const d = set[key] || set['dots'] || {};

  let inner = '';
  if (d.stroke) inner += '<path d="' + d.stroke + '" fill="none" stroke="#fff" stroke-width="' +
    (d.width || 1.7) + '" stroke-linecap="round" stroke-linejoin="round"/>';
  if (d.fill) inner += '<path d="' + d.fill + '" fill="#fff"/>';

  if (!inner) {
    const letter = (String(label || '').trim()[0] || '?').toUpperCase();
    inner = '<text x="12" y="12" fill="#fff" font-size="12" font-weight="600" font-family="inherit" ' +
            'text-anchor="middle" dominant-baseline="central">' + esc(letter) + '</text>';
  }

  const style = size ? ' style="width:' + size + 'px;height:' + size + 'px;flex-basis:' + size + 'px"' : '';
  return '<div class="badge"' + style + ' data-c="' + (color || '#9C9283') + '">' +
         '<svg viewBox="0 0 24 24">' + inner + '</svg></div>';
}

// цвет кружка ставим после вставки: в атрибуте style его перебил бы размер
function paintBadges(root) {
  (root || document).querySelectorAll('.badge[data-c]').forEach(el => {
    el.style.background = el.dataset.c;
    el.removeAttribute('data-c');
  });
}

// ═══════════════════════ данные ═══════════════════════

let currentMonth = monthKey(todayISO());
let screen = 'ops';
let busy = false;

const accountsById = () => Object.fromEntries((LS.state?.accounts || []).map(a => [a.Id, a]));
const categoriesById = () => Object.fromEntries((LS.state?.categories || []).map(c => [c.Id, c]));

/** Эффект операции на общий баланс: перевод его не меняет. */
function effect(op) {
  if (!op || op.Kind === 2) return 0;
  return op.Kind === 1 ? op.Amount : -op.Amount;
}

/** Как операция меняет остаток конкретного счёта; перевод один уменьшает, другой увеличивает. */
function effectOn(op, accountId) {
  if (!op) return 0;
  if (op.Kind === 2) {
    if (op.AccountId === accountId) return -op.Amount;
    if (op.ToAccountId === accountId) return op.Amount;
    return 0;
  }
  if (op.AccountId !== accountId) return 0;
  return op.Kind === 1 ? op.Amount : -op.Amount;
}

/**
 * Всё, что телефон знает, а компьютер ещё не подтвердил: и не отправленное,
 * и отправленное, но не влитое в базу. До появления записи в данных с ПК
 * показываем её сами — иначе операция пропадала бы из списка до синхронизации.
 */
function pendingRecords() {
  return LS.queue.map(r => ({ ...r, _stage: 'queued' }))
    .concat(LS.sent.map(r => ({ ...r, _stage: 'sent' })));
}

/**
 * Операции месяца с учётом неподтверждённого.
 * Записи проходим по порядку: последняя про операцию побеждает, иначе
 * изменённая и затем удалённая операция возвращалась бы в список.
 */
function opsOf(ym) {
  const stored = (LS.months[ym] || { operations: [] }).operations || [];

  const overrides = new Map();          // id → операция либо null, если удалена
  for (const item of pendingRecords()) {
    if (item.action === 'delete') overrides.set(item.opId, null);
    else if (item.op) overrides.set(item.op.Id, { ...item.op, _stage: item._stage });
  }

  const result = [];
  for (const op of stored) {
    if (!overrides.has(op.Id)) { result.push(op); continue; }

    const replacement = overrides.get(op.Id);
    overrides.delete(op.Id);
    if (replacement && monthKey(replacement.Date) === ym)
      result.push({ ...replacement, _pending: true });
  }

  for (const op of overrides.values())
    if (op && monthKey(op.Date) === ym) result.push({ ...op, _pending: true });

  return result;
}

/** Насколько неподтверждённые записи двигают общий баланс. */
function pendingAdjust() {
  return pendingRecords().reduce((sum, item) => sum + recordDelta(item, effect), 0);
}

/** То же самое для одного счёта. */
function pendingAdjustFor(accountId) {
  return pendingRecords().reduce((sum, item) =>
    sum + recordDelta(item, op => effectOn(op, accountId)), 0);
}

/**
 * Вклад записи: новое состояние минус прежнее. Для новой операции прежнего нет,
 * для удаления нет нового — поэтому обе стороны считаются одной формулой.
 */
function recordDelta(item, measure) {
  const after = item.action === 'delete' ? null : item.op;
  const before = item.prev || null;

  // записи старого формата знали только общий сдвиг
  if (!item.prev && item.action === 'delete' && typeof item.balanceDelta === 'number' && measure === effect)
    return item.balanceDelta;

  return measure(after) - measure(before);
}

/** Остаток счёта с учётом того, что ещё не доехало до компьютера. */
function accountBalance(accountId) {
  const base = (LS.state?.balances || {})[accountId] || 0;
  return base + pendingAdjustFor(accountId);
}

/**
 * Отправленные записи держим до тех пор, пока не увидим их в данных с компьютера.
 * Сравниваем по содержимому: у правки идентификатор тот же, и одного его мало.
 */
function signature(op) {
  return [op.Kind, op.Amount, op.CategoryId || '', op.AccountId || '',
          op.ToAccountId || '', String(op.Date).slice(0, 10), (op.Note || '').trim()].join('|');
}

const recordOpId = item => item.action === 'delete' ? item.opId : item.op.Id;

const recordMonth = item => item.action === 'delete'
  ? (item.month || monthKey(item.prev ? item.prev.Date : todayISO()))
  : monthKey(item.op.Date);

/**
 * Убирает записи, которые компьютер уже применил.
 *
 * Судим по итогу на операцию, а не по каждой записи отдельно: если операцию
 * создали и тут же удалили, порознь удаление выглядит применённым (в данных с ПК
 * его и не было), а создание — нет, и операция возвращалась бы в список.
 */
/** Столько ждём между «компьютер забрал файл» и «компьютер выложил результат». */
const SETTLE_GRACE_MS = 3 * 60 * 1000;

function reconcileSent(inbox) {
  const sent = LS.sent;
  if (!sent.length) return;

  // по этим операциям есть ещё не отправленное — их черёд не настал
  const queued = new Set(LS.queue.map(recordOpId));

  const byOp = new Map();                               // операция → все её записи по порядку
  for (const item of sent) {
    const id = recordOpId(item);
    if (!byOp.has(id)) byOp.set(id, []);
    byOp.get(id).push(item);
  }

  const settled = new Set();

  for (const [id, records] of byOp) {
    if (queued.has(id)) continue;

    const item = records[records.length - 1];           // итог решает последняя запись
    const month = LS.months[recordMonth(item)];
    if (!month) continue;                               // месяц не загружен — судить не по чему

    const stored = (month.operations || []).find(o => o.Id === id);
    const applied = item.action === 'delete'
      ? !stored
      : (stored && signature(stored) === signature(item.op));

    if (applied) { settled.add(id); continue; }

    // Компьютер забрал все наши файлы по этой операции, выложил данные, а изменения
    // в них нет: запись либо перекрыта более поздней, либо отклонена. Держать её в
    // «ждёт компьютера» бессмысленно — честнее показывать то, что есть на самом деле.
    if (!inbox) continue;

    const taken = records.every(r => !inbox.has(r.id + '.json'));
    const settledLongAgo = records.every(r =>
      !r.createdUtc || Date.now() - Date.parse(r.createdUtc) > SETTLE_GRACE_MS);

    if (taken && settledLongAgo) settled.add(id);
  }

  LS.sent = sent.filter(item => !settled.has(recordOpId(item)));
}

/** Месяцы, по которым ещё ждём подтверждения от компьютера. */
function pendingMonths() {
  return new Set(LS.sent.map(recordMonth));
}

/**
 * Аварийный выход: перестать ждать компьютер. Сами операции уже уехали во входящие
 * и никуда не денутся — телефон просто перестаёт показывать их отдельно и начинает
 * верить выложенным данным.
 */
function forgetSent() {
  if (!LS.sent.length) return;
  if (!confirm('Перестать ждать компьютер по ' + LS.sent.length + ' записи(ям)?\n\n' +
               'Операции останутся во входящих и применятся, когда компьютер включится. ' +
               'Телефон будет показывать то, что уже выложено.')) return;

  LS.sent = [];
  render();
}

function knownMonths() {
  const fromState = (LS.state?.months || []).slice();
  const now = monthKey(todayISO());
  if (!fromState.includes(now)) fromState.push(now);
  return fromState.sort();
}

// ═══════════════════════ загрузка ═══════════════════════

async function refresh(silent) {
  const cfg = LS.cfg;
  if (!cfg.owner || !cfg.repo || !cfg.token) { openSettings(); return; }
  if (busy) return;
  busy = true;
  byId('btn-refresh').textContent = '…';

  try {
    await flushQueue();

    const state = await ghGet('state.json');
    if (state) LS.state = JSON.parse(state.text);

    const icons = await ghGet('icons.json');
    if (icons) LS.icons = JSON.parse(icons.text);

    await loadMonth(currentMonth, true);

    // Месяц, в котором что-то ждёт компьютера, перечитываем тоже. Иначе удаление
    // в прошлом месяце висело бы вечно: в памяти телефона лежит копия, сделанная
    // до удаления, и запись никогда не признавалась бы применённой.
    for (const ym of pendingMonths())
      if (ym !== currentMonth) await loadMonth(ym, true);

    // что ещё лежит во входящих — по этому видно, забрал компьютер наши файлы или нет
    let inbox = null;
    try { inbox = new Set(await ghList('inbox')); } catch (e) { inbox = null; }

    reconcileSent(inbox);
    render();
  } catch (e) {
    if (!silent) showBanner(e.message, true);
    render();
  } finally {
    busy = false;
    byId('btn-refresh').textContent = 'Обновить';
  }
}

async function loadMonth(ym, force) {
  const cache = LS.months;
  if (cache[ym] && !force) return;

  const file = await ghGet('ops/' + ym + '.json');
  cache[ym] = file ? JSON.parse(file.text) : { month: ym, operations: [] };
  LS.months = cache;
  reconcileSent();
}

async function flushQueue() {
  const queue = LS.queue;
  if (!queue.length) return;

  const rest = [];
  const delivered = [];

  for (const item of queue) {
    try {
      await ghPut('inbox/' + item.id + '.json', JSON.stringify(item), 'операция с телефона');
      delivered.push(item);
    } catch (e) {
      rest.push(item);
    }
  }

  LS.queue = rest;
  // отправленное не выбрасываем: показываем сами, пока компьютер не подтвердит
  if (delivered.length) LS.sent = LS.sent.concat(delivered);
}

function enqueue(record) {
  const queue = LS.queue;
  queue.push(record);
  LS.queue = queue;
  render();
  flushQueue().then(render).catch(() => {});
}

// ═══════════════════════ отрисовка ═══════════════════════

const SCREENS = [
  { id: 'ops', name: 'Операции', icon: 'M3,6 H21 M3,12 H21 M3,18 H14' },
  { id: 'report', name: 'Отчёт', icon: 'M4,20 V10 M10,20 V4 M16,20 V14 M22,20 H2' },
  { id: 'accounts', name: 'Счета', icon: 'M3,7 H21 V18 H3 Z M3,11 H21' },
  { id: 'budgets', name: 'Бюджеты', icon: 'M6,18 L18,6 M8,7 A2,2 0 1,1 8,7.01 M16,17 A2,2 0 1,1 16,17.01' },
];

function renderNav() {
  byId('nav').innerHTML = SCREENS.map(s =>
    '<button data-screen="' + s.id + '" class="' + (screen === s.id ? 'active' : '') + '">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="' + s.icon + '"/></svg>' +
    s.name + '</button>').join('');

  byId('nav').querySelectorAll('button').forEach(b => {
    b.onclick = async () => {
      screen = b.dataset.screen;
      render();
      if (screen === 'ops' || screen === 'report') {
        try { await loadMonth(currentMonth); render(); } catch (e) {}
      }
    };
  });
}

function render() {
  renderNav();

  const state = LS.state;
  const queue = LS.queue;

  const sent = LS.sent;
  byId('pending-banner').style.display = (queue.length || sent.length) ? 'block' : 'none';
  if (queue.length || sent.length) {
    const parts = [];
    if (queue.length) parts.push('ждут отправки: ' + queue.length);
    if (sent.length) parts.push('ждут компьютера: ' + sent.length);

    byId('pending-banner').className = 'banner' + (sent.length ? ' tappable' : '');
    byId('pending-banner').textContent = parts.join(', ') +
      '. Итоги ниже уже с их учётом.' +
      (sent.length ? ' Нажмите, если висит дольше обычного.' : '');
  }
  byId('pending-banner').onclick = sent.length ? forgetSent : null;

  byId('btn-add').style.display = screen === 'ops' ? 'block' : 'none';
  byId('monthbar').style.display = (screen === 'ops' || screen === 'report') ? 'flex' : 'none';

  if (!state) {
    byId('view').innerHTML = '<div class="center muted">Нет данных. Проверьте подключение в настройках.</div>';
    return;
  }

  byId('balance').textContent = money((state.total || 0) + pendingAdjust());
  byId('month-label').textContent = monthTitle(currentMonth);

  const months = knownMonths();
  byId('month-prev').disabled = months.indexOf(currentMonth) <= 0;
  byId('month-next').disabled = currentMonth >= monthKey(todayISO());

  const ops = opsOf(currentMonth);
  let income = 0, expense = 0;
  for (const op of ops) {
    if (op.Kind === 1) income += op.Amount;
    else if (op.Kind === 0) expense += op.Amount;
  }
  byId('stats').textContent = 'за месяц  +' + money(income) + '   −' + money(expense);
  byId('screen-title').textContent = SCREENS.find(s => s.id === screen)?.name || 'Финансы';

  if (screen === 'ops') renderOps(ops);
  else if (screen === 'report') renderReport(ops);
  else if (screen === 'accounts') renderAccounts();
  else if (screen === 'budgets') renderBudgets();

  paintBadges(byId('view'));
}

function opRowHtml(op) {
  const accounts = accountsById(), categories = categoriesById();
  const transfer = op.Kind === 2;
  const cat = categories[op.CategoryId];
  const acc = accounts[op.AccountId];
  const to = accounts[op.ToAccountId];

  const color = transfer ? (to?.Color || '#9AA8A2') : (cat?.Color || '#9AA8A2');
  const key = transfer ? (to?.Icon || 'export') : (cat?.Icon || 'dots');
  const title = transfer ? (acc?.Name || '—') + ' → ' + (to?.Name || '—') : (cat?.Name || 'Без категории');
  const amount = transfer ? money(op.Amount) : (op.Kind === 1 ? '+' : '−') + money(op.Amount);
  const tint = transfer ? 'var(--text2)' : (op.Kind === 1 ? 'var(--income)' : 'var(--expense)');

  return '<div class="row" data-op="' + esc(op.Id) + '">' + icon(key, color, 0, title) +
    '<div class="body"><div class="title">' + esc(title) + '</div>' +
    (op.Note ? '<div class="note">' + esc(op.Note) + '</div>' : '') +
    '</div><div><div class="amount" style="color:' + tint + '">' + amount + '</div>' +
    '<div class="sub">' + (op._pending
      ? (op._stage === 'sent' ? 'ждёт компьютера' : 'ждёт отправки')
      : esc(acc?.Name || '')) + '</div></div></div>';
}

function renderOps(ops) {
  if (!ops.length) {
    byId('view').innerHTML = '<div class="center muted">В этом месяце операций нет.</div>';
    return;
  }

  const groups = {};
  for (const op of ops) (groups[String(op.Date).slice(0, 10)] ||= []).push(op);

  let html = '';
  for (const day of Object.keys(groups).sort().reverse()) {
    const list = groups[day];
    const sum = list.reduce((acc, op) => acc + effect(op), 0);
    html += '<div class="daygroup"><span style="color:var(--text2)">' + esc(dayTitle(day)) +
            '</span><span>' + money(sum) + '</span></div><div class="card">' +
            list.map(opRowHtml).join('') + '</div>';
  }

  byId('view').innerHTML = html;
  byId('view').querySelectorAll('.row[data-op]').forEach(row => {
    row.onclick = () => {
      const op = opsOf(currentMonth).find(o => o.Id === row.dataset.op);
      if (op) openOperation(op);
    };
  });
}

function renderReport(ops) {
  const categories = categoriesById();
  const kinds = [
    { kind: 0, title: 'Расходы по категориям', tint: 'var(--expense)' },
    { kind: 1, title: 'Доходы по категориям', tint: 'var(--income)' },
  ];

  let html = '';
  for (const { kind, title, tint } of kinds) {
    const list = ops.filter(o => o.Kind === kind);
    const total = list.reduce((s, o) => s + o.Amount, 0);
    if (!total) continue;

    const byCat = {};
    for (const op of list) byCat[op.CategoryId] = (byCat[op.CategoryId] || 0) + op.Amount;

    const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const max = rows[0][1];

    html += '<div class="card"><h3>' + title + '</h3>' +
      '<div class="row" style="padding-top:0"><div class="body"><div class="title">Всего</div></div>' +
      '<div class="amount" style="color:' + tint + '">' + money(total) + '</div></div>';

    for (const [id, sum] of rows) {
      const cat = categories[id];
      html += '<div class="row">' + icon(cat?.Icon || 'dots', cat?.Color || '#9C9283', 34, cat?.Name) +
        '<div class="body"><div class="title">' + esc(cat?.Name || 'Без категории') +
        '<span class="muted" style="float:right">' + percent(sum / total) + '</span></div>' +
        '<div class="track"><div style="width:' + (sum / max * 100) + '%;background:' +
        (cat?.Color || '#9AA8A2') + '"></div></div></div>' +
        '<div class="amount">' + money(sum) + '</div></div>';
    }
    html += '</div>';
  }

  byId('view').innerHTML = html || '<div class="center muted">В этом месяце считать нечего.</div>';
}

function renderAccounts() {
  const state = LS.state;
  const accrued = state.accrued || {};

  let html = '<div class="card">';
  for (const acc of (state.accounts || []).filter(a => !a.Archived)) {
    const balance = accountBalance(acc.Id);     // с учётом неподтверждённого
    const savings = acc.Kind === 1;

    html += '<div class="row" ' + (savings ? 'data-forecast="' + esc(acc.Id) + '"' : '') + '>' +
      icon(acc.Icon, acc.Color, 0, acc.Name) +
      '<div class="body"><div class="title">' + esc(acc.Name) + '</div>' +
      '<div class="note">' + (savings
        ? 'вклад ' + rateText(acc.AnnualRate) + ' · капитализация ' +
          (acc.Capitalization === 1 ? 'ежедневно' : 'ежемесячно')
        : 'обычный счёт') + '</div></div>' +
      '<div><div class="amount" style="color:' + (balance < 0 ? 'var(--expense)' : 'var(--text)') + '">' +
      money(balance) + '</div>' +
      (savings ? '<div class="sub" style="color:var(--income)">+' + money(accrued[acc.Id] || 0) + ' процентами</div>'
               : '') + '</div></div>';
  }
  html += '</div>';

  const savings = (state.accounts || []).filter(a => !a.Archived && a.Kind === 1);
  if (savings.length) html += '<div class="muted" style="margin:0 4px">Нажмите на вклад, чтобы посмотреть прогноз.</div>';

  byId('view').innerHTML = html;
  byId('view').querySelectorAll('[data-forecast]').forEach(row => {
    row.onclick = () => openForecast(row.dataset.forecast);
  });
}

function renderBudgets() {
  const state = LS.state;
  const categories = categoriesById();
  const budgets = (state.budgets || []).filter(b => b.Enabled && b.Limit > 0);
  const spentMap = state.budgetsSpent || {};

  if (!budgets.length) {
    byId('view').innerHTML = '<div class="center muted">Бюджеты не заданы. Их можно настроить в приложении на компьютере.</div>';
    return;
  }

  const periodName = p => p === 1 ? 'в неделю' : p === 3 ? 'в год' : 'в месяц';
  const thisMonth = monthKey(todayISO());

  let totalLimit = 0, totalSpent = 0;
  let html = '<div class="card">';

  for (const b of budgets) {
    const cat = categories[b.CategoryId];
    let spent = spentMap[b.Id] || 0;

    // к тому, что посчитал компьютер, добавляем свои неподтверждённые траты текущего месяца
    if (b.Period === 2) {
      for (const item of pendingRecords()) {
        const inBudget = op => op && op.Kind === 0 && op.CategoryId === b.CategoryId &&
                               monthKey(op.Date) === thisMonth;
        const after = item.action === 'delete' ? null : item.op;
        if (inBudget(after)) spent += after.Amount;
        if (inBudget(item.prev)) spent -= item.prev.Amount;
      }
    }

    totalLimit += b.Limit;
    totalSpent += spent;

    const share = Math.min(1, spent / b.Limit);
    const over = spent > b.Limit;
    const color = over ? 'var(--expense)' : share > 0.85 ? 'var(--accent)' : 'var(--primary)';

    html += '<div class="row">' + icon(cat?.Icon || 'dots', cat?.Color || '#9C9283', 34, cat?.Name) +
      '<div class="body"><div class="title">' + esc(cat?.Name || '—') +
      '<span class="muted" style="float:right">' + periodName(b.Period) + '</span></div>' +
      '<div class="track"><div style="width:' + (share * 100) + '%;background:' + color + '"></div></div>' +
      '<div class="note" style="color:' + (over ? 'var(--expense)' : 'var(--muted)') + '">' +
      money(spent) + ' из ' + money(b.Limit) +
      (over ? ' · превышение ' + money(spent - b.Limit) : ' · осталось ' + money(b.Limit - spent)) +
      '</div></div></div>';
  }

  html += '</div><div class="card"><div class="row" style="padding:0">' +
    '<div class="body"><div class="title">Всего лимитов</div>' +
    '<div class="note">потрачено ' + money(totalSpent) + '</div></div>' +
    '<div class="amount">' + money(totalLimit) + '</div></div></div>';

  byId('view').innerHTML = html;
}

function rateText(rate) {
  return (Math.round(rate * 100) / 100).toLocaleString('ru-RU') + '%';
}

function showBanner(text, bad) {
  const el = byId('pending-banner');
  el.style.display = 'block';
  el.className = 'banner' + (bad ? ' bad' : '');
  el.textContent = text;
  el.onclick = null;                    // на плашке сейчас не счётчик ожидания
}

// ═══════════════════════ операция: создание и правка ═══════════════════════

let addKind = 0;
let addCategoryId = null;
let editing = null;

function openAdd() {
  if (!LS.state) { showBanner('Сначала загрузите данные', true); return; }
  editing = null;
  addKind = 0;
  addCategoryId = null;

  byId('add-title').textContent = 'Новая операция';
  byId('add-save').textContent = 'Добавить';
  byId('add-delete').style.display = 'none';
  byId('add-amount').value = '';
  byId('add-note').value = '';
  byId('add-date').value = todayISO();
  byId('add-hint').textContent = 'Можно ввести выражение: 450+120*2';

  setKindTabs(0);
  fillAccounts();
  fillCategories();
  applyKind();
  byId('sheet-add').classList.add('open');
  setTimeout(() => byId('add-amount').focus(), 120);
}

function openOperation(op) {
  editing = op;
  addKind = op.Kind;
  addCategoryId = op.CategoryId || null;

  byId('add-title').textContent = 'Операция';
  byId('add-save').textContent = 'Сохранить';
  byId('add-delete').style.display = 'block';
  byId('add-amount').value = String(op.Amount).replace('.', ',');
  byId('add-note').value = op.Note || '';
  byId('add-date').value = String(op.Date).slice(0, 10);
  byId('add-hint').textContent = ' ';

  setKindTabs(op.Kind);
  fillAccounts(op.AccountId, op.ToAccountId);
  fillCategories();
  applyKind();
  byId('sheet-add').classList.add('open');
}

function setKindTabs(kind) {
  byId('add-tabs').querySelectorAll('button').forEach(b =>
    b.classList.toggle('active', Number(b.dataset.kind) === kind));
}

function fillAccounts(selected, selectedTo) {
  const accounts = (LS.state.accounts || []).filter(a => !a.Archived || a.Id === selected || a.Id === selectedTo);
  const options = accounts.map(a => '<option value="' + esc(a.Id) + '">' + esc(a.Name) + '</option>').join('');

  byId('add-account').innerHTML = options;
  byId('add-to-account').innerHTML = options;

  if (selected) byId('add-account').value = selected;
  if (selectedTo) byId('add-to-account').value = selectedTo;
  else if (accounts.length > 1 && byId('add-to-account').value === byId('add-account').value)
    byId('add-to-account').selectedIndex = accounts.findIndex(a => a.Id !== byId('add-account').value);
}

function fillCategories() {
  const cats = (LS.state.categories || []).filter(c => c.Kind === addKind && (!c.Archived || c.Id === addCategoryId));
  byId('add-categories').innerHTML = cats.map(c =>
    '<div class="tile' + (c.Id === addCategoryId ? ' sel' : '') + '" data-id="' + esc(c.Id) + '">' +
    icon(c.Icon, c.Color, 0, c.Name) + '<div class="name">' + esc(c.Name) + '</div></div>').join('');

  paintBadges(byId('add-categories'));

  byId('add-categories').querySelectorAll('.tile').forEach(tile => {
    tile.onclick = () => {
      addCategoryId = tile.dataset.id;
      byId('add-categories').querySelectorAll('.tile').forEach(t => t.classList.toggle('sel', t === tile));
    };
  });
}

function applyKind() {
  const transfer = addKind === 2;
  byId('add-category-block').style.display = transfer ? 'none' : 'block';
  byId('add-to-block').style.display = transfer ? 'block' : 'none';
  byId('add-account-label').textContent = transfer ? 'СО СЧЁТА' : 'СЧЁТ';
}

function saveOperation() {
  const amount = evalAmount(byId('add-amount').value);
  if (!(amount > 0)) { alert('Введите сумму больше нуля'); return; }

  const transfer = addKind === 2;
  if (!transfer && !addCategoryId) { alert('Выберите категорию'); return; }

  const from = byId('add-account').value;
  const to = byId('add-to-account').value;
  if (transfer && from === to) { alert('Счета должны быть разными'); return; }

  const id = editing ? editing.Id : (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  const op = {
    Id: id,
    Kind: addKind,
    Amount: amount,
    CategoryId: transfer ? '' : addCategoryId,
    AccountId: from,
    ToAccountId: transfer ? to : null,
    Date: byId('add-date').value + 'T00:00:00',
    Note: byId('add-note').value.trim(),
    CreatedAt: editing?.CreatedAt || new Date().toISOString(),
  };

  enqueue({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    device: 'phone',
    createdUtc: new Date().toISOString(),
    action: 'upsert',
    op,
    // прежнее состояние нужно, чтобы правильно двигать итоги по каждому счёту
    prev: editing ? stripLocal(editing) : null,
  });

  byId('sheet-add').classList.remove('open');
}

/** Служебные пометки в базу не отправляем. */
function stripLocal(op) {
  const copy = { ...op };
  delete copy._pending;
  delete copy._stage;
  return copy;
}

function deleteOperation() {
  if (!editing) return;
  if (!confirm('Удалить операцию?')) return;

  enqueue({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    device: 'phone',
    createdUtc: new Date().toISOString(),
    action: 'delete',
    opId: editing.Id,
    prev: stripLocal(editing),
    month: monthKey(editing.Date),
  });

  byId('sheet-add').classList.remove('open');
}

// ═══════════════════════ прогноз ═══════════════════════
// Повторяет расчёт из приложения на компьютере: база копится каждый день,
// зачисляется в конце расчётного периода и дальше сама приносит проценты.

let forecastAccount = null;
let forecastUntil = null;

const daysInYear = y => ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365;
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const isLastDayOfMonth = d => d.getDate() === daysInMonth(d.getFullYear(), d.getMonth());

// Банк меняет ставку, и прошлые дни должны считаться по той, что действовала тогда.
function rateOn(account, day) {
  const history = account.RateHistory || [];
  if (!history.length) return Number(account.AnnualRate) || 0;

  const stamp = iso(day);
  let best = null, earliest = null;

  for (const change of history) {
    const from = String(change.From).slice(0, 10);
    if (!earliest || from < earliest.from) earliest = { from, rate: Number(change.Rate) || 0 };
    if (from <= stamp && (!best || from > best.from)) best = { from, rate: Number(change.Rate) || 0 };
  }

  return best ? best.rate : earliest.rate;
}

// Сколько набежит за период — вместе с тем, что ещё не легло на счёт.
// При ежемесячной капитализации заработанное сегодня зачислится в конце месяца.
function accruedOver(account, startBalance, from, to, topUp, topUpDay, deltas) {
  if (!account || account.Kind !== 1 || to < from) return 0;

  const today = new Date(); today.setHours(0, 0, 0, 0);
  let balance = startBalance, accrued = 0, pending = 0;

  for (let d = new Date(from.getTime()); d <= to; d = new Date(d.getTime() + 86400000)) {
    // База дня — остаток на 00:00, то есть до операций этого дня
    if (balance > 0) {
      const add = balance * rateOn(account, d) / 100 / daysInYear(d.getFullYear());
      accrued += add;
      pending += add;
    }

    if (deltas) balance += deltas[iso(d)] || 0;

    // будущие пополнения тоже начинают приносить проценты — со следующего дня
    if (topUp > 0 && d > today && d.getDate() === Math.min(topUpDay, daysInMonth(d.getFullYear(), d.getMonth())))
      balance += topUp;

    if (account.Capitalization === 1 || isLastDayOfMonth(d)) {
      balance += round2(pending);
      pending = 0;
    }
  }

  return round2(accrued);
}

/**
 * Остаток счёта на 00:00 указанного дня и его изменения по дням дальше —
 * то же, что на компьютере даёт `Store.AccountBalanceAsOf` со списком операций.
 * В `state.balances` лежит остаток со всеми операциями любой даты, поэтому
 * всё, что случилось в этот день и позже, вычитаем обратно.
 */
function accountTimeline(accountId, from) {
  const stamp = iso(from);

  const months = new Set(Object.keys(LS.months || {}));
  for (const item of pendingRecords()) {
    if (item.op) months.add(monthKey(item.op.Date));
    if (item.month) months.add(item.month);
  }

  let ahead = 0;
  const deltas = {};

  for (const ym of months) {
    if (ym < monthKey(stamp)) continue;               // месяц целиком в прошлом

    for (const op of opsOf(ym)) {
      const day = String(op.Date).slice(0, 10);
      if (day < stamp) continue;

      const signed = effectOn(op, accountId);
      if (!signed) continue;

      ahead += signed;
      deltas[day] = (deltas[day] || 0) + signed;
    }
  }

  return { opening: accountBalance(accountId) - ahead, deltas };
}

// Час, к которому банк уже провёл начисление; до него деньги на счёте не появляются.
const PAYOUT_HOUR = 17;

// Когда набежавшее появится на счёте — в конце расчётного периода: в тот же день
// при ежедневной капитализации, в последний день месяца при ежемесячной.
function payoutDate(account, day) {
  if (account.Capitalization === 1) return new Date(day.getFullYear(), day.getMonth(), day.getDate());
  return new Date(day.getFullYear(), day.getMonth(), daysInMonth(day.getFullYear(), day.getMonth()));
}

// Точный момент зачисления — дата плюс час начисления.
function payoutMoment(account, day) {
  const d = payoutDate(account, day);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), PAYOUT_HOUR);
}

function computeForecast(account, startBalance, until, topUp, topUpDay) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const result = { start: startBalance, points: [{ date: iso(today), balance: startBalance, interest: 0 }],
                   interest: 0, added: 0, days: 0 };

  let balance = startBalance, pending = 0;
  const savings = account.Kind === 1;

  for (let d = new Date(today.getTime() + 86400000); d <= until; d = new Date(d.getTime() + 86400000)) {
    // на остаток в 00:00 — тем же порядком, что и настоящее начисление
    const rate = savings ? rateOn(account, d) : 0;
    if (rate > 0 && balance > 0) pending += balance * rate / 100 / daysInYear(d.getFullYear());

    if (topUp > 0) {
      const day = Math.min(topUpDay, daysInMonth(d.getFullYear(), d.getMonth()));
      if (d.getDate() === day) { balance += topUp; result.added += topUp; }
    }

    const payout = account.Capitalization === 1 || isLastDayOfMonth(d);
    if (payout && rate > 0) {
      const gained = round2(pending);
      balance += gained;
      result.interest += gained;
      pending = 0;
    }

    if (isLastDayOfMonth(d) || d.getTime() === until.getTime())
      result.points.push({ date: iso(d), balance, interest: result.interest });
  }

  result.final = balance;
  result.days = Math.round((until - today) / 86400000);
  return result;
}

function openForecast(accountId) {
  const state = LS.state;
  forecastAccount = (state.accounts || []).find(a => a.Id === accountId);
  if (!forecastAccount) return;

  const effRate = (Math.pow(1 + (Number(forecastAccount.AnnualRate) || 0) / 100 /
    (forecastAccount.Capitalization === 1 ? 365 : 12), forecastAccount.Capitalization === 1 ? 365 : 12) - 1) * 100;

  byId('forecast-info').textContent =
    forecastAccount.Name + ': ставка ' + rateText(forecastAccount.AnnualRate) + ' годовых, ' +
    (forecastAccount.Capitalization === 1 ? 'ежедневная' : 'ежемесячная') + ' капитализация — ' +
    'это ' + rateText(effRate) + ' в год. Сейчас ' + money(accountBalance(accountId)) + '.';

  const horizons = [
    ['неделя', 7, 0], ['месяц', 0, 1], ['3 месяца', 0, 3], ['полгода', 0, 6],
    ['год', 0, 12], ['3 года', 0, 36], ['5 лет', 0, 60],
  ];
  byId('forecast-horizons').innerHTML = horizons.map(([name, days, months], i) =>
    '<button data-days="' + days + '" data-months="' + months + '"' +
    (i === 4 ? ' class="active"' : '') + '>' + name + '</button>').join('');

  byId('forecast-horizons').querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      byId('forecast-horizons').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      setForecastUntil(horizonDate(Number(b.dataset.days), Number(b.dataset.months)));
    };
  });

  setForecastUntil(horizonDate(0, 12));
  byId('sheet-forecast').classList.add('open');
}

function horizonDate(days, months) {
  const until = new Date(); until.setHours(0, 0, 0, 0);
  if (days) until.setDate(until.getDate() + days);
  if (months) until.setMonth(until.getMonth() + months);
  return until;
}

function setForecastUntil(until) {
  forecastUntil = until;
  byId('forecast-until').value = iso(until);
  recalcForecast();
}

// «Сколько набежит» — короткие сроки, которые видно каждый день,
// в отличие от прогноза на годы вперёд.
// «Сколько набежит» показывает заработанное, а не зачисленное: при ежемесячной
// капитализации деньги за сегодня лягут на счёт в конце месяца, но заработаны уже сегодня.
function renderNearTerm(account, balance, topUp, topUpDay) {
  const box = byId('forecast-near');
  if (account.Kind !== 1) { box.innerHTML = ''; return; }

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = ms => new Date(today.getTime() + ms * 86400000);
  const endOfMonth = new Date(today.getFullYear(), today.getMonth(),
    daysInMonth(today.getFullYear(), today.getMonth()));

  const rows = [
    ['сегодня', today, today],
    ['завтра', day(1), day(1)],
    ['за 7 дней', today, day(6)],
    ['за 30 дней', today, day(29)],
    ['до конца месяца', today, endOfMonth],
  ];

  if (forecastUntil && forecastUntil > today)
    rows.push(['до ' + shortDate(forecastUntil), today, forecastUntil]);

  let html = '<div class="card" style="margin-top:16px"><h3>Сколько набежит</h3>';

  for (const [label, from, to] of rows) {
    const timeline = accountTimeline(account.Id, from);
    const amount = accruedOver(account, timeline.opening, from, to, topUp, topUpDay, timeline.deltas);

    // подпись «зачислится» уместна, только когда весь срок укладывается в один
    // расчётный период и час зачисления ещё не прошёл
    const payout = payoutDate(account, to);
    const onePayment = payoutDate(account, from).getTime() === payout.getTime();

    const note = onePayment && payoutMoment(account, to) > new Date()
      ? '<div class="note">зачислится ' + shortDate(payout) + ' к ' + PAYOUT_HOUR + ':00</div>' : '';

    html += '<div class="row"><div class="body"><div class="title">' + label + '</div>' + note + '</div>' +
      '<div class="amount" style="color:var(--income)">+' + money(amount) + '</div></div>';
  }

  html += '<div class="muted" style="margin-top:10px">Здесь заработанное. Банк проводит ' +
    'начисление днём, поэтому на счёте деньги появляются к ' + PAYOUT_HOUR + ':00.</div>';

  box.innerHTML = html + '</div>';
}

function recalcForecast() {
  if (!forecastAccount || !forecastUntil) return;

  const balance = accountBalance(forecastAccount.Id);
  const topUp = evalAmount(byId('forecast-topup').value) || 0;
  const day = Math.max(1, Math.min(31, parseInt(byId('forecast-day').value, 10) || 1));

  renderNearTerm(forecastAccount, balance, topUp, day);

  const f = computeForecast(forecastAccount, balance, forecastUntil, topUp, day);
  const own = f.start + f.added;

  let html = '<div class="card" style="margin-top:16px"><div class="muted">Будет на счёте</div>' +
    '<div class="big">' + money(f.final) + '</div>' +
    '<div class="split" style="margin-top:12px">' +
    '<div><div class="muted">Внесено</div><div style="font-weight:600">' + money(own) + '</div></div>' +
    '<div><div class="muted">Проценты</div><div style="font-weight:600;color:var(--income)">+' +
    money(f.interest) + '</div></div></div>' +
    '<div class="muted" style="margin-top:10px">За ' + f.days + ' дн. проценты добавят ' +
    percent(own > 0 ? f.interest / own : 0) + ' к вложенному.</div></div>';

  // вехи: последняя точка каждого полугодия плюс итог
  const marks = [];
  const step = f.points.length > 26 ? 6 : 3;
  for (let i = step; i < f.points.length - 1; i += step) marks.push(f.points[i]);
  marks.push(f.points[f.points.length - 1]);

  html += '<div class="card"><h3>По срокам</h3>';
  for (const p of marks) {
    const d = new Date(p.date + 'T00:00:00');
    html += '<div class="row"><div class="body"><div class="title">' +
      d.getDate() + ' ' + MONTHS_GEN[d.getMonth()] + ' ' + d.getFullYear() + '</div>' +
      '<div class="note" style="color:var(--income)">+' + money(p.interest) + ' процентами</div></div>' +
      '<div class="amount">' + money(p.balance) + '</div></div>';
  }
  html += '</div>';

  byId('forecast-result').innerHTML = html;
}

// ═══════════════════════ настройки ═══════════════════════

// ═══════════════════════ оформление ═══════════════════════

const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme() {
  const mode = LS.cfg.theme || 'system';
  const dark = mode === 'dark' || (mode === 'system' && darkQuery.matches);

  document.documentElement.dataset.theme = dark ? 'dark' : 'light';

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#191614' : '#F6F3EE');

  document.querySelectorAll('#cfg-theme button').forEach(b =>
    b.classList.toggle('active', b.dataset.theme === mode));
}

darkQuery.addEventListener('change', () => { if ((LS.cfg.theme || 'system') === 'system') applyTheme(); });

document.querySelectorAll('#cfg-theme button').forEach(button => {
  button.onclick = () => {
    const cfg = LS.cfg;
    cfg.theme = button.dataset.theme;
    LS.cfg = cfg;
    applyTheme();
  };
});

function openSettings() {
  const cfg = LS.cfg;
  applyTheme();
  byId('cfg-owner').value = cfg.owner || '';
  // подставляем значением, а не подсказкой: серый текст легко принять за заполненное
  byId('cfg-repo').value = cfg.repo || 'finance_data';
  byId('cfg-token').value = cfg.token || '';
  byId('cfg-status').textContent = '';
  byId('sheet-settings').classList.add('open');
}

async function saveSettings() {
  // дополняем, а не заменяем: в настройках лежат ещё тема и ветка
  LS.cfg = Object.assign({}, LS.cfg, {
    owner: byId('cfg-owner').value.trim(),
    repo: byId('cfg-repo').value.trim(),
    token: byId('cfg-token').value.trim(),
  });

  const missing = [];
  if (!LS.cfg.owner) missing.push('логин');
  if (!LS.cfg.repo) missing.push('репозиторий');
  if (!LS.cfg.token) missing.push('токен');
  if (missing.length) {
    byId('cfg-status').textContent = 'Не заполнено: ' + missing.join(', ') + '.';
    return;
  }

  byId('cfg-status').textContent = 'Проверяю…';
  try {
    const repo = await ghRepo();
    const cfg = LS.cfg;
    cfg.branch = repo.default_branch || 'main';
    LS.cfg = cfg;

    let state = await ghGet('state.json');
    if (!state && cfg.branch !== 'main') {
      cfg.branch = 'main'; LS.cfg = cfg;
      state = await ghGet('state.json');
      if (!state) { cfg.branch = repo.default_branch || 'main'; LS.cfg = cfg; }
    }

    if (!state) {
      byId('cfg-status').textContent = 'Репозиторий ' + repo.full_name + ' виден, ветка ' + cfg.branch +
        ', но файла state.json нет. Нажмите «Синхронизировать сейчас» на компьютере.';
      return;
    }

    LS.state = JSON.parse(state.text);
    byId('cfg-status').textContent = 'Готово: месяцев в истории — ' + (LS.state.months || []).length + '.';
    byId('sheet-settings').classList.remove('open');
    refresh(true);
  } catch (e) {
    byId('cfg-status').textContent = e.message;
  }
}

// ═══════════════════════ события ═══════════════════════

byId('btn-add').onclick = openAdd;
byId('btn-refresh').onclick = () => refresh(false);
byId('btn-settings').onclick = openSettings;
byId('add-close').onclick = byId('add-cancel').onclick = () => byId('sheet-add').classList.remove('open');
byId('forecast-close').onclick = () => byId('sheet-forecast').classList.remove('open');
byId('settings-close').onclick = () => byId('sheet-settings').classList.remove('open');
byId('add-save').onclick = saveOperation;
byId('add-delete').onclick = deleteOperation;
byId('cfg-save').onclick = saveSettings;
byId('forecast-topup').oninput = recalcForecast;
byId('forecast-day').oninput = recalcForecast;

byId('forecast-until').onchange = () => {
  const value = byId('forecast-until').value;
  if (!value) return;

  const until = new Date(value + 'T00:00:00');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (isNaN(until) || until <= today) { byId('forecast-until').value = iso(forecastUntil); return; }

  byId('forecast-horizons').querySelectorAll('button').forEach(x => x.classList.remove('active'));
  forecastUntil = until;
  recalcForecast();
};

byId('cfg-forget').onclick = () => {
  if (confirm('Удалить настройки подключения с этого устройства?')) {
    localStorage.clear();
    location.reload();
  }
};

byId('month-prev').onclick = async () => {
  const months = knownMonths();
  const i = months.indexOf(currentMonth);
  if (i > 0) {
    currentMonth = months[i - 1];
    render();
    try { await loadMonth(currentMonth); render(); } catch (e) { showBanner(e.message, true); }
  }
};

byId('month-next').onclick = async () => {
  const months = knownMonths();
  const i = months.indexOf(currentMonth);
  if (i >= 0 && i < months.length - 1) {
    currentMonth = months[i + 1];
    render();
    try { await loadMonth(currentMonth); render(); } catch (e) { showBanner(e.message, true); }
  }
};

byId('add-amount').oninput = () => {
  const raw = byId('add-amount').value;
  const value = evalAmount(raw);
  byId('add-hint').textContent = !raw ? 'Можно ввести выражение: 450+120*2'
    : (value > 0 ? (/[+\-*/()]/.test(raw) ? '= ' + money(value) : ' ') : 'Не похоже на сумму');
};

byId('add-tabs').querySelectorAll('button').forEach(button => {
  button.onclick = () => {
    addKind = Number(button.dataset.kind);
    addCategoryId = null;
    setKindTabs(addKind);
    fillCategories();
    applyKind();
  };
});

window.addEventListener('online', () => flushQueue().then(render).catch(() => {}));

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

applyTheme();
render();
refresh(true);
</script>
</body>
</html>
